[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi-dl"
version = "0.1.0"
description = "Download public MEGA links from the terminal, with SmartProxy-style quota recovery. Not affiliated with Mega Limited."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Ruizhen Gu" },
    { name = "Kiaro Sama" },
]
keywords = ["mega", "mega.nz", "downloader", "cli", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.5.0",
    "requests>=2.31.0",
    "pycryptodome>=3.19.0",
    "tenacity>=8.2.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    # <9.2: pytest 9.2 derives Node.nodeid from a structured id, so the
    # `item._nodeid` write that pytest-xdist (3.8.0) uses to tag xdist_group
    # members has no effect - `--dist loadgroup` quietly degrades to `load`
    # and the xdist_group marks in tests/ (sdist_build, launcher_subprocess)
    # split across workers. Lift this once pytest-xdist supports the new ids.
    "pytest>=7.4.0,<9.2",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    # Required by tests/test_sdist_packaging.py. Without it that test used to
    # skip, so `pip install -e ".[dev]" && pytest` went green having never
    # built an sdist - the one thing it exists to check.
    "build>=1.0.0",
    "black>=23.9.0,<26",
    # Kept unpinned here; the type gate pins them exactly in the Lint
    # workflow, which is the one place it runs.
    "types-requests>=2.31",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/ruizhengu/kiwi-dl"
Repository = "https://github.com/ruizhengu/kiwi-dl"
"Bug Tracker" = "https://github.com/ruizhengu/kiwi-dl/issues"
"Built on" = "https://github.com/KiaroSama/MegaBasterd-CLI"

[project.scripts]
mg-dl = "kiwi_dl.cli:mg_dl_main"
kiwi-dl = "kiwi_dl.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kiwi_dl*"]

[tool.setuptools.package-data]
kiwi_dl = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# -n auto fans the suite across every core; the suite is ~4x faster for it
# (202s -> ~50s on 16 cores). Each xdist worker is its own PROCESS, so
# module-level state cannot leak between tests that land on different
# workers - which is also why nothing had to be rewritten to enable this.
# Override with `-n0` when stepping through a single test in a debugger.
addopts = "-v --tb=short --strict-markers -n auto --dist loadgroup"
pythonpath = ["src"]
