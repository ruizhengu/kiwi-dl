name: Release

# A tag push builds the sdist, proves it installs clean, and attaches it to
# the GitHub release. That tarball is what the Homebrew formula pins, so its
# bytes must be stable - this is why the formula downloads the release asset
# rather than a GitHub-generated archive.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # attach the sdist to the release

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A formula pins one tarball per tag; a tag that disagrees with the
      # version it carries would bake the mismatch into Homebrew forever.
      # The version lives in TWO sources - pyproject (what the sdist metadata
      # says) and `kiwi_dl.__version__` (what `kdl --version` and the
      # User-Agent report). A tag is only valid when both carry it; only one
      # being bumped is exactly how a "0.2.0" release reports "0.1.0".
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          runtime=$(python -c "import sys; sys.path.insert(0, 'src'); import kiwi_dl; print(kiwi_dl.__version__)")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ] || [ "${runtime}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject v${version} / __version__ ${runtime}"
            exit 1
          fi

      - name: Run the test suite
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
          pytest

      - name: Build the sdist
        run: python -m build --sdist

      # The formula installs this exact tarball into a brew venv; a broken or
      # incomplete sdist would fail there, so fail here instead, in a clean
      # venv with no checkout beside it.
      - name: Smoke-test the sdist in a clean venv
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/kdl --version
          /tmp/sdist-venv/bin/kiwi-dl --help > /dev/null

      # No --clobber: a re-run must fail loudly rather than silently replace
      # the bytes a Homebrew formula has already pinned by hash.
      - name: Attach the sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$tag" dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
