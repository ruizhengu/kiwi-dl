name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64).
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"


      - name: Run tests
        # -n auto comes from addopts in pyproject.toml, so a local run and this
        # job fan out the same way. Coverage is currently ~86%; the gate is 84.
        run: pytest --cov=kiwi_dl --cov-report=term --cov-fail-under=84

      # The console scripts are how a pip/pipx install is actually run.
      - name: Smoke-test installed commands
        run: |
          kdl --help
          kdl --version
          kiwi-dl --help
          python -m kiwi_dl --help

  # install.sh the way a user runs it, with each installer it supports: uv on
  # macOS, pipx on Ubuntu. The source is this checkout, so the job installs the
  # code under review rather than main.
  installer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            installer: uv
          - os: ubuntu-latest
            installer: pipx
    steps:
      - uses: actions/checkout@v7

      - if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@v6

      - if: matrix.os == 'ubuntu-latest'
        name: Lint install.sh
        run: shellcheck install.sh

      - name: Install with install.sh
        env:
          KIWI_DL_SOURCE: ${{ github.workspace }}
          KIWI_DL_INSTALLER: ${{ matrix.installer }}
        run: bash install.sh

      - name: Use, update and remove the installed tool
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kiwi-dl --version
          kdl --help > /dev/null
          kiwi-dl update --dry-run
          kiwi-dl completion zsh > /dev/null
          kiwi-dl remove --purge --yes
          hash -r
          if command -v kiwi-dl; then echo "kiwi-dl is still installed"; exit 1; fi
