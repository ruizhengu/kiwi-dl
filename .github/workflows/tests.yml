name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64).
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"


      - name: Run tests
        # -n auto comes from addopts in pyproject.toml, so a local run and this
        # job fan out the same way. Coverage is currently ~86%; the gate is 84.
        run: pytest --cov=kiwi_dl --cov-report=term --cov-fail-under=84

      # The console scripts are how a pip/pipx install is actually run.
      - name: Smoke-test installed commands
        run: |
          mg-dl --help
          mg-dl --version
          kiwi-dl --help
          python -m kiwi_dl --help
