name: Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Advisories land without anyone pushing code, so also run weekly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pip-audit

      # Audits the runtime dependency set that actually ships to users: the
      # specifiers in pyproject.toml, resolved the way an install would, so an
      # advisory in any reachable version fails the build.
      - name: Audit runtime dependencies
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > "$RUNNER_TEMP/requirements.txt"
          pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
