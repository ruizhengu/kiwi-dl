name: Bug report
description: Report a problem with kiwi-dl
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in the details below.

  - type: input
    id: version
    attributes:
      label: Version
      description: "Run `kdl --version` and paste the output."
      placeholder: "kiwi-dl, version 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.1"

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Exact command you ran and what you expected.
      placeholder: |
        1. kdl "https://mega.nz/file/..." -o ~/Downloads
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the output of running with `-vv` (debug logging).
      render: shell
